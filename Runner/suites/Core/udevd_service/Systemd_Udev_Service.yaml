metadata:
  name: udev_service_info
  format: Lava-Test Test Definition 1.0
  description: "Check that systemd-udevd is running on the DUT without adb"
  maintainer:
    - "Qualcomm Linux Testkit"

params: {}

run:
  steps:
    - |
      REPO_PATH="$PWD"
      TEST_DIR="$REPO_PATH/Runner/suites/System/Systemd_Udev_Service"
      RESULT_FILE="$TEST_DIR/Systemd_Udev_Service.res"

      cd "$TEST_DIR" || exit 1
      ./run.sh || true

      if [ ! -f "$RESULT_FILE" ]; then
          echo "Result file was not created: $RESULT_FILE"
          exit 1
      fi

      cat "$RESULT_FILE"
      "$REPO_PATH/Runner/utils/send-to-lava.sh" "$RESULT_FILE"