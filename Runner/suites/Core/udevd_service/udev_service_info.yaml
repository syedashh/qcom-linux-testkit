metadata:
  name: udev_service_info
  format: Lava-Test Test Definition 1.0
  description: "Check that systemd-udevd is running on the DUT"
  maintainer:
    - "Qualcomm Linux Testkit"

params: {}

run:
  steps:
    - |
      SEARCH_ROOT="${TESTS_DIR:-$PWD}"
      PUBLISHER="$(find "$SEARCH_ROOT" -type f -path '*/Runner/utils/send-to-lava.sh' -print -quit 2>/dev/null)"

      if [ -z "$PUBLISHER" ]; then
          echo "Could not find Runner/utils/send-to-lava.sh under $SEARCH_ROOT"
          exit 1
      fi

      REPO_PATH="${PUBLISHER%/Runner/utils/send-to-lava.sh}"
      TEST_DIR="$REPO_PATH/Runner/suites/Core/udevd_service"
      RESULT_FILE="$TEST_DIR/Systemd_Udev_Service.res"

      if [ ! -f "$TEST_DIR/run.sh" ]; then
          echo "Test script not found: $TEST_DIR/run.sh"
          exit 1
      fi

      cd "$TEST_DIR" || exit 1
      chmod +x ./run.sh
      ./run.sh || true

      if [ ! -f "$RESULT_FILE" ]; then
          echo "Result file was not created: $RESULT_FILE"
          exit 1
      fi

      cat "$RESULT_FILE"
      "$PUBLISHER" "$RESULT_FILE"