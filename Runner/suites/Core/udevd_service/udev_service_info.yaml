metadata:
  name: udev_service_info
  format: Lava-Test Test Definition 1.0
  description: "Check that systemd-udevd is running on the DUT without adb"
  maintainer:
    - "Qualcomm Linux Testkit"

params: {}

run:
  steps:
    - REPO_PATH=$PWD
    - cd "$REPO_PATH/Runner/suites/System/Systemd_Udev_Service"
    - ./run.sh || true
    - "$REPO_PATH/Runner/utils/send-to-lava.sh" "$REPO_PATH/Runner/suites/System/Systemd_Udev_Service/Systemd_Udev_Service.res"